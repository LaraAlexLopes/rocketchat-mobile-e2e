name: Mobile E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  ROCKETCHAT_VERSION: 8.9.1
  ROCKETCHAT_APP_VERSION: 4.78.1

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  e2e:
    name: Android E2E
    needs: quality
    # Pinned: MongoDB 8.0 refuses to start on Linux kernel >= 6.19 (SERVER-121912),
    # which ships with the Ubuntu 26 image behind ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Show Docker versions
        run: docker version && docker compose version

      - name: Start Rocket.Chat server
        run: npm run server:up

      - name: Dump server logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps -a
          docker compose -f docker/docker-compose.yml logs --tail 200 mongodb rocketchat

      - name: Verify test data layer (seed, cleanup, sweep)
        run: npm run test:data

      - name: Download Rocket.Chat APK
        run: npm run app:download

      - name: Install Appium UiAutomator2 driver
        run: npm run appium:setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure autofill_service null
            npm test

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            allure-report
            logs
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Stop Rocket.Chat server
        if: always()
        run: npm run server:down

  report:
    name: Publish Allure report
    needs: e2e
    if: always() && github.ref == 'refs/heads/main' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
